name: Update data and notify

on:
  schedule:
    - cron: "7 * * * *" # Hourly refresh and immediate risk-state alerts.
    - cron: "0 14 * * *" # Daily email at 22:00 Asia/Shanghai (UTC+8).
  workflow_dispatch:
    inputs:
      notify_mode:
        description: Email mode
        required: true
        default: auto
        type: choice
        options:
          - auto
          - daily
          - test

permissions:
  contents: write

concurrency:
  group: lfcx-epoch-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update market data
        run: python scripts/update_data.py
      - name: Send scheduled email or risk alert
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.notify_mode || (github.event.schedule == '0 14 * * *' && 'daily' || 'auto') }}
        run: python scripts/notify.py --mode "$NOTIFY_MODE"
      - name: Persist refreshed data
        run: |
          git config user.name "lfcx-epoch-bot"
          git config user.email "lfcx-epoch-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh BTC cycle metrics"
            git push
          fi
